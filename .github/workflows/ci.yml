name: CI

on:
  # Validate every pull request against main before merging.
  pull_request:
    branches: [main]
  # Reused by deploy.yml, so the checks and the build live in a single place.
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload dist/ as the GitHub Pages artifact after a successful build.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Check internal links
        run: node scripts/check-links.mjs
      - name: Upload the site
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
