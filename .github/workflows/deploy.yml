name: Deploy to GitHub Pages

on:
  # Publish the blog on every push to main. Pull requests are validated by ci.yml.
  push:
    branches: [main]
  # Allow running it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks and build that run on pull requests.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-pages-artifact: true

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
