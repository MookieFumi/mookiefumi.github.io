# --- General options --- #

# url: dirección pública del blog (dominio propio, ver CNAME)
# baseurl: ruta bajo el dominio; vacía porque el blog está en la raíz
url: "https://mookiefumi.com"
baseurl: ""

# Name of website
title: "~/mookie"

# Short description of your site
description: .NET, IA y seguridad, explicados con laboratorios que puedes ejecutar

# --- Navigation bar options --- #

# List of links in the navigation bar
navbar-links:
  Temas: "temas"
  Sobre mí: "aboutme"
  # Resources:
  #   - Beautiful Jekyll: "http://deanattali.com/beautiful-jekyll/"
  #   - Learn markdown: "http://www.markdowntutorial.com/"
  #   - GitHub Pages: "https://pages.github.com/"
  # Author's home: "http://deanattali.com"

# Image to show in the navigation bar - image must be a square (width = height)
# Remove this parameter if you don't want an image in the navbar
avatar: "/img/avatar-icon.jpg"

# --- Footer options --- #

# Change all these values or delete the ones you don't want.
# Important: you must keep the "name" parameter, everything else you can remove
author:
  name: Miguel Angel Martin Hrdez
  email: "me@mookiefumi.com"
  github: MookieFumi
  twitter: MookieFumi
  linkedin: "in/mookiefumi"  # eg. "pub/dean-attali/8/946/143"
  #stackoverflow: yourlink  # eg. "3943160/daattali"
 
# Select which links to show in the footer
footer-links-active:
  rss: true
  facebook: false
  email: true
  twitter: true
  github: true
  linkedin: true
  stackoverflow: false

# How to display the link to the website in the footer
# Remove this if you don't want a link in the footer
url-pretty: "mookiefumi.com"

# --- Misc --- #

# Fill in your Disqus shortname (NOT the userid) if you want to support Disqus comments
disqus: "mookiefumi"

# Fill in your Cloudflare Web Analytics token to track your website
# (Analytics & Logs > Web Analytics in the Cloudflare dashboard, JS-snippet mode)
cloudflare_analytics_token: "8607a246a64647feb5441c86af7234bc"

# --- Don't need to touch anything below here (but you can if you want) --- #

# Output options (more information on Jekyll's site)
timezone: Europe/Madrid
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: /:year-:month-:day-:title
paginate: 10
future: true

# Plugins
plugins: [jekyll-redirect-from, jekyll-paginate]

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true  # add comments to all blog posts
  -
    scope:
      path: "" # all files
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
