<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.description }}{% endif %}</title>

  <meta name="author" content="{{ site.author.name }}">
  <meta name="description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">

  <!-- Aplica el tema guardado antes de pintar para evitar un destello -->
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>

  <link rel="icon" href="{{ '/favicon.svg' | prepend: site.baseurl }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon-32x32.png' | prepend: site.baseurl }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | prepend: site.baseurl }}">
  <meta name="theme-color" content="#05070A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..700&display=swap">

  <link rel="stylesheet" href="{{ '/css/tokens.css' | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ '/css/site.css' | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ '/css/syntax.css' | prepend: site.baseurl }}">
  {% for css in page.css %}
  <link rel="stylesheet" href="{{ css | prepend: site.baseurl | replace: '//', '/' }}">
  {% endfor %}
  {% for css in page.ext-css %}
  <link rel="stylesheet" href="{{ css }}">
  {% endfor %}

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} - {{ site.description }}" href="{{ '/feed.xml' | prepend: site.baseurl }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:type" content="{% if page.id %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | remove: '/index.html' | remove: '.html' }}">
  <meta property="og:description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">
  {% if page.fb-img %}
  <meta property="og:image" content="{{ page.fb-img }}">
  {% else %}
  <meta property="og:image" content="{{ site.url }}/img/brand/mookie-og.png">
  {% endif %}
</head>
