<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ site.baseurl }}/">
      <span class="brand-path">~/</span>{{ site.title | remove_first: '~/' }}<span class="cursor" aria-hidden="true"></span>
    </a>
    <nav class="site-nav" aria-label="Principal">
      <div class="nav-tabs">
      {% for link in site.navbar-links %}
        {% assign href = site.baseurl | append: '/' | append: link[1] %}
        {% assign page_path = page.url | remove: '.html' %}
        {% assign link_path = '/' | append: link[1] %}
        <a href="{{ href }}"{% if page_path == link_path %} aria-current="page"{% endif %}>{{ link[0] }}</a>
      {% endfor %}
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a modo claro" aria-pressed="true">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
