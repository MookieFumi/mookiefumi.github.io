---
layout: base
---

<div class="container-narrow">
  <header class="page-hero">
    {% if page.avatar and site.avatar %}
    <img class="page-avatar" src="{{ site.avatar | prepend: site.baseurl }}" alt="{{ site.author.name }}" width="120" height="120">
    {% endif %}
    <h1>{{ page.title | remove: '#' }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  {% if page.comments %}
  <div class="comments">
    {% include disqus.html %}
  </div>
  {% endif %}
</div>
