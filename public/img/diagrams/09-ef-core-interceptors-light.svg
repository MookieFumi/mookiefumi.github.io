<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 736" width="1200" height="736" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#556070"/></marker></defs><text x="24" y="44" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0B0E14" text-anchor="start">Los siete interceptores de EF Core</text><text x="24" y="68" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#556070" text-anchor="start">En qué momento entra cada uno al leer y al escribir. Línea discontinua: ya descrito en la otra columna.</text><rect x="24" y="92" width="564" height="604" rx="14" fill="#FFFFFF" stroke="#D9DEE5"/><rect x="24" y="92" width="564" height="5" rx="2.5" fill="#0B6FB8"/><text x="40" y="128" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#0B6FB8" text-anchor="start" letter-spacing="1.4">LEER</text><text x="572" y="128" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="13" font-weight="400" fill="#556070" text-anchor="end">db.Products.Where(...).ToListAsync()</text><rect x="40" y="150" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#0B6FB8" stroke-width="1.5"/><circle cx="70" cy="180" r="14" fill="#0B6FB8"/><text x="70" y="185" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="96" y="184" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IQueryExpressionInterceptor</text><text x="96" y="208" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Antes de traducir el LINQ (una vez por forma de consulta)</text><text x="96" y="229" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B6FB8" text-anchor="start">Reescribir la consulta</text><line x1="70" y1="242" x2="70" y2="255" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="258" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#0B6FB8" stroke-width="1.5"/><circle cx="70" cy="288" r="14" fill="#0B6FB8"/><text x="70" y="293" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="96" y="292" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IDbConnectionInterceptor</text><text x="96" y="316" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Al abrir la conexión</text><text x="96" y="337" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B6FB8" text-anchor="start">Base de datos por inquilino, token de acceso</text><line x1="70" y1="350" x2="70" y2="363" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="366" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#0B6FB8" stroke-width="1.5"/><circle cx="70" cy="396" r="14" fill="#0B6FB8"/><text x="70" y="401" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="96" y="400" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IDbCommandInterceptor</text><text x="96" y="424" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Antes y después de ejecutar el SQL</text><text x="96" y="445" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B6FB8" text-anchor="start">Ver el SQL real, consultas lentas</text><line x1="70" y1="458" x2="70" y2="471" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="474" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#0B6FB8" stroke-width="1.5"/><circle cx="70" cy="504" r="14" fill="#0B6FB8"/><text x="70" y="509" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="96" y="508" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IMaterializationInterceptor</text><text x="96" y="532" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Al convertir cada fila en una entidad</text><text x="96" y="553" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B6FB8" text-anchor="start">Propiedades no mapeadas</text><rect x="612" y="92" width="564" height="604" rx="14" fill="#FFFFFF" stroke="#D9DEE5"/><rect x="612" y="92" width="564" height="5" rx="2.5" fill="#3B7A00"/><text x="628" y="128" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#3B7A00" text-anchor="start" letter-spacing="1.4">ESCRIBIR</text><text x="1160" y="128" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="13" font-weight="400" fill="#556070" text-anchor="end">db.Attach(product); db.SaveChangesAsync()</text><rect x="628" y="150" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#3B7A00" stroke-width="1.5"/><circle cx="658" cy="180" r="14" fill="#3B7A00"/><text x="658" y="185" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="684" y="184" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IIdentityResolutionInterceptor</text><text x="684" y="208" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Al rastrear una clave que ya está rastreada</text><text x="684" y="229" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3B7A00" text-anchor="start">Fusionar valores en vez de lanzar excepción</text><line x1="658" y1="242" x2="658" y2="255" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="628" y="258" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#3B7A00" stroke-width="1.5"/><circle cx="658" cy="288" r="14" fill="#3B7A00"/><text x="658" y="293" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="684" y="292" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">ISaveChangesInterceptor</text><text x="684" y="316" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Antes y después de SaveChanges</text><text x="684" y="337" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3B7A00" text-anchor="start">Auditoría, borrado lógico, outbox</text><line x1="658" y1="350" x2="658" y2="363" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="628" y="366" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="658" cy="396" r="14" fill="none" stroke="#3B7A00" stroke-width="1.5"/><text x="658" y="401" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#3B7A00" text-anchor="middle">3</text><text x="684" y="400" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IDbConnectionInterceptor</text><text x="684" y="424" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Al abrir la conexión</text><line x1="658" y1="458" x2="658" y2="471" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="628" y="474" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#3B7A00" stroke-width="1.5"/><circle cx="658" cy="504" r="14" fill="#3B7A00"/><text x="658" y="509" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="684" y="508" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IDbTransactionInterceptor</text><text x="684" y="532" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Inicio, commit y rollback explícito (con dos o más sentencias)</text><text x="684" y="553" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3B7A00" text-anchor="start">Registrar transacciones</text><line x1="658" y1="566" x2="658" y2="579" stroke="#556070" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="628" y="582" width="532" height="90" rx="10" fill="#ECEFF3" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="658" cy="612" r="14" fill="none" stroke="#3B7A00" stroke-width="1.5"/><text x="658" y="617" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="14" font-weight="700" fill="#3B7A00" text-anchor="middle">2</text><text x="684" y="616" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#0B0E14" text-anchor="start">IDbCommandInterceptor</text><text x="684" y="640" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#556070" text-anchor="start">Por cada INSERT, UPDATE o DELETE</text><text x="1176" y="724" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="13" font-weight="500" fill="#556070" text-anchor="end">mookiefumi.com</text></svg>
